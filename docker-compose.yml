# elt_agent 单机编排（阿里云 ECS / Docker Compose）
# 用法：
#   docker compose up -d                                      # 默认：控制面全套（轻量常驻）
#   docker compose --profile demo up -d                       # 追加：MySQL + Doris + SeaTunnel（吃内存）
#   docker compose --profile obs  up -d                       # 追加：Prometheus + Grafana
#
# 安全约定：所有数据中间件端口只绑定 127.0.0.1，外网仅 Nginx(HTTP_PORT) 可达。
#           ECS 安全组必须同步收紧，只放行 SSH 与 HTTP_PORT。

name: elt-agent

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-backend-env: &backend-env
  env_file: [.env]
  environment:
    APP_ENV: ${APP_ENV:-dev}
  restart: unless-stopped
  logging: *default-logging
  networks: [elt_net]

services:
  # ============================ 控制面基础设施 ============================

  postgres:
    image: postgres:16-alpine
    container_name: elt-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必填}
      POSTGRES_DB: ${POSTGRES_DB:-elt_agent}
      # 中文排序与大小写不敏感检索
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # 仅本机/SSH 隧道可连
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elt} -d ${POSTGRES_DB:-elt_agent}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    networks: [elt_net]
    deploy:
      resources:
        limits: { memory: 2g }

  redis:
    image: redis:7-alpine
    container_name: elt-redis
    # 口令走环境变量而不是只写在 command 里：healthcheck 是 CMD-SHELL，
    # `$$REDIS_PASSWORD` 由容器内的 shell 展开。只写 command 的话这个变量在容器里
    # **根本不存在**，展开成空串，于是 `redis-cli -a "" ping` 报 WRONGPASS、
    # 容器永久 unhealthy——而 api/worker/beat 都 depends_on: service_healthy，
    # 结果是整套控制面永远起不来（这个坑实测踩过：FailingStreak 53）。
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 必填}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD 必填}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1gb
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"      # 绝不可暴露公网
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
    networks: [elt_net]
    deploy:
      resources:
        limits: { memory: 1280m }

  minio:
    image: minio/minio:latest
    container_name: elt-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-elt-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 必填}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    networks: [elt_net]

  # 首次初始化：创建制品桶
  minio-init:
    image: minio/mc:latest
    container_name: elt-minio-init
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-elt-minio} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-elt-artifacts} &&
      echo 'minio bucket ready'
      "
    restart: "no"
    logging: *default-logging
    networks: [elt_net]

  # Vault：M1 用 dev 模式快速起步（内存存储，重启即失）。
  # TODO(M4)：切 server 模式 + file/raft 存储 + AppRole + 自动 unseal，并纳入备份。
  vault:
    image: hashicorp/vault:1.17
    container_name: elt-vault
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-change-me-vault-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev
    ports:
      - "127.0.0.1:8200:8200"
    restart: unless-stopped
    logging: *default-logging
    networks: [elt_net]

  # 首次初始化：把 KV v2 挂到应用配置的那个路径上。
  #
  # Vault dev 模式**只自动挂 `secret/`**，而 `VAULT_KV_MOUNT` 默认是 `kv`。
  # 不建这个挂载的话，第一次写数据源凭据就会 404「密钥不存在：?」——
  # 报错在 clients/vault.py，根因却在没人建 mount，隔着三层很难一次看对。
  # 做成一次性服务而不是手工敲命令：dev 模式是内存存储、重启即失，必须可重复执行。
  vault-init:
    image: hashicorp/vault:1.17
    container_name: elt-vault-init
    depends_on:
      vault: { condition: service_started }
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-change-me-vault-token}
    entrypoint: >
      /bin/sh -c "
      for i in $$(seq 1 30); do vault secrets list >/dev/null 2>&1 && break; sleep 1; done;
      vault secrets enable -path=${VAULT_KV_MOUNT:-kv} -version=2 kv 2>/dev/null
      || echo 'kv 挂载已存在，跳过';
      vault secrets list -format=json | grep -q '\"${VAULT_KV_MOUNT:-kv}/\"'
      && echo 'vault kv 挂载就绪' || { echo 'vault kv 挂载失败'; exit 1; }
      "
    restart: "no"
    logging: *default-logging
    networks: [elt_net]

  # ============================ 控制面应用 ============================

  # 一次性迁移任务：建表结构。
  #
  # 为什么必须是独立服务而不是塞进 api 的启动命令：
  # api/worker/beat 都可能有多个副本（scale），塞进 entrypoint 会让
  # 「谁先起来谁迁移」变成竞态；而且迁移失败时应当**阻止** api 启动，
  # 而不是让一个连不上表的 api 起在那里反复 500。
  # `service_completed_successfully` 正是这个语义。
  migrate:
    <<: *backend-env
    image: elt-agent-backend:local
    container_name: elt-migrate
    command: alembic upgrade head
    restart: "no"   # 覆盖锚点里的 unless-stopped：跑完就退出的任务不该被反复拉起
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - ./secrets:/run/secrets:ro

  api:
    <<: *backend-env
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: elt-agent-backend:local
    container_name: elt-api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    # API 与 worker/beat 共用同一镜像，避免三份依赖漂移
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 1g }

  worker:
    <<: *backend-env
    image: elt-agent-backend:local
    container_name: elt-worker
    command: celery -A tasks.celery_app worker -l info -Q etl.default,etl.execute --concurrency=${CELERY_WORKER_CONCURRENCY:-4}
    depends_on:
      api: { condition: service_started }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./secrets:/run/secrets:ro
      - seatunnel_jobs:/tmp/seatunnel-jobs
    deploy:
      resources:
        limits: { memory: 1536m }

  beat:
    <<: *backend-env
    image: elt-agent-backend:local
    container_name: elt-beat
    command: celery -A tasks.celery_app beat -l info
    depends_on:
      api: { condition: service_started }
      redis: { condition: service_healthy }
    volumes:
      - ./secrets:/run/secrets:ro
    deploy:
      resources:
        limits: { memory: 512m }

  nginx:
    image: nginx:1.27-alpine
    container_name: elt-nginx
    depends_on:
      api: { condition: service_started }
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *default-logging
    networks: [elt_net]

  # ============================ 演示数据面（profile: demo）============================
  # Doris all-in-one 需 8G+ 内存、启动约 1-2 分钟；ECS 规格未确认前不要默认启动。

  mysql:
    profiles: [demo]
    image: mysql:8.0
    container_name: elt-mysql
    command: >
      --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --binlog_expire_logs_seconds=604800
    environment:
      MYSQL_ROOT_PASSWORD: ${DEMO_MYSQL_ROOT_PASSWORD:?必填}
      MYSQL_DATABASE: ${DEMO_MYSQL_DB:-biz_demo}
      MYSQL_USER: ${DEMO_MYSQL_USER:-etl_demo}
      MYSQL_PASSWORD: ${DEMO_MYSQL_PASSWORD:?必填}
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      # 宿主端口可覆盖：这台 ECS 上还跑着别的项目的 mysql8（占着 3306），
      # 默认值保持 3306 不动，只在 .env 里设 DEMO_MYSQL_HOST_PORT 错开
      - "127.0.0.1:${DEMO_MYSQL_HOST_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    logging: *default-logging
    networks: [elt_net]
    deploy:
      resources:
        limits: { memory: 2g }

  doris:
    profiles: [demo]
    # 镜像名可覆盖：这台 ECS 连不上 Docker Hub（daemon.json 里的加速器全部失效，
    # 实测 `docker manifest inspect apache/doris:2.1.9-all` 直接 MISSING），只有
    # 第三方代理 `docker.1panel.live` 可用。**tag 也只剩 `-all` 这一形态**：
    # `2.1.4-allinone-x86_64` / `2.1.9-allinone-x86_64` 在该代理上都不存在。
    image: ${DORIS_IMAGE:-docker.1panel.live/apache/doris:2.1.9-all}
    container_name: elt-doris
    environment:
      FE_SERVERS: "fe1:172.28.0.10:9010"
      FE_ID: "1"
      PRIORITY_NETWORKS: "172.28.0.0/24"
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
      memlock: { soft: -1, hard: -1 }
    volumes:
      - doris_data:/opt/apache-doris
    ports:
      - "127.0.0.1:9030:9030"   # MySQL 协议
      - "127.0.0.1:8030:8030"   # HTTP
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -P 9030 -u root -e 'select 1' >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped
    logging: *default-logging
    networks:
      elt_net:
        ipv4_address: 172.28.0.10
    deploy:
      resources:
        limits: { memory: 8g }

  # 目标库初始化：Doris 就绪后建 ``dw_demo`` 与正式宽表。
  # 用一次性容器而不是往 doris 镜像里塞 initdb 脚本：Doris 镜像没有
  # ``/docker-entrypoint-initdb.d`` 这套约定（那是 MySQL/PG 的），
  # 而「谁负责建正式表」必须是一个**可重复执行**的动作（全部 IF NOT EXISTS）。
  doris-init:
    profiles: [demo]
    image: mysql:8.0
    container_name: elt-doris-init
    depends_on:
      doris: { condition: service_healthy }
    volumes:
      - ./deploy/doris/init:/sql:ro
    entrypoint:
      - sh
      - -c
      - |
        set -e
        for f in /sql/*.sql; do
          echo "applying $$f"
          mysql --default-auth=mysql_native_password -h doris -P 9030 -u root --protocol=tcp < "$$f"
        done
        echo "doris-init done"
    restart: "no"
    logging: *default-logging
    networks: [elt_net]

  # SeaTunnel Zeta：以集群模式常驻并开放 REST API(8080)，worker 通过 API 提交/停止作业。
  # TODO(M3)：首次实测确认镜像内的启动脚本路径与 REST API 可用性；
  #           若 REST API 不可用，退化为「worker 容器内挂载发行包 + CLI 提交 + 进程管理」。
  seatunnel:
    profiles: [demo]
    # 同 doris：走代理（两个官方镜像在本机都解析不到）。
    image: ${SEATUNNEL_IMAGE:-docker.1panel.live/apache/seatunnel:2.3.9}
    container_name: elt-seatunnel
    # 启动前补 JDBC 驱动：官方镜像的 connectors/ 里有 seatunnel-connector-jdbc，
    # 但**不含**各数据库的 JDBC 驱动 jar（许可原因），少了它作业会在
    # 「加载驱动类」那一步失败——报错在 SeaTunnel 日志里，控制面只看到作业 FAILED。
    # 走阿里云 Maven 镜像（ECS 在境内，Maven Central 常连不上）。
    command: >
      sh -c "
      JDBC_DIR=/opt/seatunnel/connectors;
      dl() { [ -f \"$$JDBC_DIR/$$2\" ] || curl -fsSL --retry 3 -o \"$$JDBC_DIR/$$2\" \"$$1\"; };
      dl https://maven.aliyun.com/repository/public/com/mysql/mysql-connector-j/8.0.33/mysql-connector-j-8.0.33.jar mysql-connector-j-8.0.33.jar;
      ls -l \"$$JDBC_DIR\" | grep -i mysql-connector || echo 'WARN: mysql jdbc driver missing';
      ./bin/seatunnel-cluster.sh -d; sleep infinity"
    environment:
      JAVA_OPTS: "-Xms1g -Xmx2g"
    volumes:
      - seatunnel_jobs:/tmp/seatunnel-jobs
      - seatunnel_logs:/opt/seatunnel/logs
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    logging: *default-logging
    networks: [elt_net]
    deploy:
      resources:
        limits: { memory: 4g }

  # ============================ 可观测（profile: obs）============================

  prometheus:
    profiles: [obs]
    image: prom/prometheus:v2.54.1
    container_name: elt-prometheus
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    logging: *default-logging
    networks: [elt_net]

  grafana:
    profiles: [obs]
    image: grafana/grafana:11.2.0
    container_name: elt-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    logging: *default-logging
    networks: [elt_net]

networks:
  elt_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pg_data:
  redis_data:
  minio_data:
  mysql_data:
  doris_data:
  seatunnel_jobs:
  seatunnel_logs:
  prometheus_data:
  grafana_data:
