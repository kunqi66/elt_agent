# Alembic config.
#
# NOTE: this file is intentionally ASCII-only (English comments). Alembic reads
# it with configparser + the platform's default encoding, which on a Chinese
# Windows console is GBK -- any non-ASCII byte here raises
# UnicodeDecodeError before a single migration runs. The reasoning that would
# normally live in comments here lives in alembic/env.py instead (Python source
# is always read as UTF-8).
#
# No sqlalchemy.url on purpose: the DSN is read from core.config.settings by
# alembic/env.py. Putting it here would copy the password into version control,
# and editing .env would not update it -- which is how a migration ends up
# running against the wrong database.

[alembic]
script_location = alembic

# Let the `alembic` command find the models / core packages (run from backend/)
prepend_sys_path = .

# Timestamp prefix keeps `ls versions/` in chronological order
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
