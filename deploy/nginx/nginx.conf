# elt_agent 唯一对外入口：静态前端 + /api 反向代理
# 安全要求：管理端点不对外（Prometheus/Grafana/Vault/MinIO 控制台只能经 SSH 隧道访问）

upstream elt_api {
    server api:8000;
    keepalive 32;
}

# 限流：登录与生成接口是最容易被滥用的入口
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=llm_zone:10m  rate=20r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 32m;          # 文件数据源上传（CSV/Excel/Parquet）
    server_tokens off;                 # 不回显 nginx 版本

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ---------- 前端静态资源 ----------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # Vue Router history 模式
    }

    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- API 反代 ----------
    location /api/ {
        proxy_pass         http://elt_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;     # 含 LLM 生成的同步接口
        proxy_read_timeout    120s;
        proxy_buffering       off;      # 生成进度需要流式可见
    }

    location = /api/v1/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://elt_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/v1/pipelines/.*/(generate|resume)$ {
        limit_req zone=llm_zone burst=3 nodelay;
        proxy_pass http://elt_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # 健康检查不记录日志
    location = /healthz {
        access_log off;
        proxy_pass http://elt_api;
    }

    # 拒绝访问隐藏文件
    location ~ /\. { deny all; }
}
