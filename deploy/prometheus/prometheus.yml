# Prometheus 抓取配置（profile: obs）
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    env: ${APP_ENV:-development}

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI 控制面（后续接入 prometheus-fastapi-instrumentator 后生效）
  - job_name: elt-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Celery 通过 celery-exporter 暴露（M4 接入）
  # - job_name: celery
  #   static_configs:
  #     - targets: ["celery-exporter:9808"]

  # SeaTunnel Zeta metrics（若镜像启用了 telemetry）
  # - job_name: seatunnel
  #   static_configs:
  #     - targets: ["seatunnel:8080"]
